<!DOCTYPE html>
<html>
<head>
    <title>Test Home URL</title>
</head>
<body>
    <h1>Test Debug cho Home URL</h1>
    <p>Nếu thấy trang này thì mapping /home đã hoạt động</p>
    
    <h3>Test Links:</h3>
    <ul>
        <li><a href="home">Link tương đối: home</a></li>
        <li><a href="/DuAnCaCanh/home">Link tuyệt đối: /DuAnCaCanh/home</a></li>
        <li><a href="home.jsp">Link trực tiếp: home.jsp</a></li>
    </ul>
    
    <h3>Debug Info:</h3>
    <script>
        document.write('<p>Current URL: ' + window.location.href + '</p>');
        document.write('<p>Context Path: ' + window.location.pathname.split('/')[1] + '</p>');
    </script>
</body>
</html>
