<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test UTF-8 Encoding</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 20px; padding: 15px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>🐠 Test UTF-8 Encoding cho AI Agent</h1>
    
    <div class="test">
        <h3>Tiếng Việt Unicode:</h3>
        <p>Bạn muốn nuôi cá cảnh đẹp không?</p>
        <p>Chúng tôi có đầy đủ thiết bị và phụ kiện.</p>
        <p>Tư vấn miễn phí cho người mới bắt đầu!</p>
    </div>

    <div class="test">
        <h3>Emoji và ký tự đặc biệt:</h3>
        <p>🐠 🐟 🏠 💡 🔧 ⚖️ 💰 ✅ 🚀</p>
        <p>°C - VNĐ - % - ≥ ≤</p>
    </div>

    <div class="test">
        <h3>Test API call:</h3>
        <button onclick="testEncoding()">Test Agent Response</button>
        <div id="result" style="margin-top: 10px; padding: 10px; background: #f9f9f9;"></div>
    </div>

    <script>
        async function testEncoding() {
            const result = document.getElementById('result');
            result.innerHTML = 'Đang test...';
            
            try {
                const response = await fetch('ai-agent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                    },
                    body: 'request=' + encodeURIComponent('Bạn có thể tư vấn cá cảnh không?') + '&mode=demo'
                });
                
                const text = await response.text();
                result.innerHTML = '<pre>' + text + '</pre>';
                
                // Check encoding
                if (text.includes('?')) {
                    result.style.backgroundColor = '#ffcccc';
                    result.innerHTML += '<br><strong style="color: red;">⚠️ Có vấn đề encoding!</strong>';
                } else {
                    result.style.backgroundColor = '#ccffcc';
                    result.innerHTML += '<br><strong style="color: green;">✅ Encoding OK!</strong>';
                }
                
            } catch (error) {
                result.innerHTML = 'Lỗi: ' + error.message;
                result.style.backgroundColor = '#ffcccc';
            }
        }
    </script>
</body>
</html>
