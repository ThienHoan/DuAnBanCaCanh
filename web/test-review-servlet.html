<!DOCTYPE html>
<html>
<head>
    <title>Test Review Servlet</title>
</head>
<body>
    <h1>Test Review Servlet</h1>
    
    <h2>Test GET request:</h2>
    <a href="submit-review">Test GET /submit-review</a><br>
    <a href="review">Test GET /review</a>
    
    <h2>Test POST request:</h2>
    <form action="submit-review" method="post">
        <input type="hidden" name="action" value="submit">
        <input type="hidden" name="productId" value="1">
        <label>Rating: <input type="number" name="rating" value="5" min="1" max="5"></label><br>
        <label>Comment: <textarea name="comment">Test review</textarea></label><br>
        <button type="submit">Submit Test Review</button>
    </form>
    
    <h2>Test with context path:</h2>
    <p>Current context path: <span id="contextPath"></span></p>
    
    <script>
        document.getElementById('contextPath').textContent = window.location.pathname.split('/')[1] || 'No context path';
    </script>
</body>
</html>
