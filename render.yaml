services:
  # PostgreSQL Database
  - type: pserv
    name: fishshop-db
    plan: free
    
  # Java Web Application
  - type: web
    name: fishshop-demo
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Database connection
      - key: DATABASE_URL
        fromDatabase:
          name: fishshop-db
          property: connectionString
          
      # App settings
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: demo
        
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        value: 338086073257-7bnq7vac6tvg8r7um3494488f2fvd10k.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET  
        value: 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
