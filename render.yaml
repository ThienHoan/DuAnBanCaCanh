services:
  # Database service - PostgreSQL (thay thế cho SQL Server)
  - type: pserv
    name: fishshop-db
    env: docker
    dockerfilePath: ./docker/Dockerfile.postgres
    plan: free
    databases:
      - name: fishshopp
        user: fishshop_user
    envVars:
      - key: POSTGRES_DB
        value: fishshopp
      - key: POSTGRES_USER
        value: fishshop_user
      - key: POSTGRES_PASSWORD
        generateValue: true
        
  # Web service - Java Web Application  
  - type: web
    name: fishshop-web
    env: java
    buildCommand: |
      # Install dependencies and build project
      chmod +x ./scripts/build.sh
      ./scripts/build.sh
    startCommand: |
      # Start Tomcat server
      chmod +x ./scripts/start.sh
      ./scripts/start.sh
    plan: free
    healthCheckPath: /
    envVars:
      # Database connection
      - key: DB_HOST
        fromService:
          type: pserv
          name: fishshop-db
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: fishshop-db
          property: port
      - key: DB_NAME
        value: fishshopp
      - key: DB_USER
        fromService:
          type: pserv  
          name: fishshop-db
          property: user
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: fishshop-db
          property: password
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: fishshop-db
          property: connectionString
          
      # Application settings
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Fish Shop
      - key: APP_VERSION
        value: "1.0"
      - key: APP_DEBUG
        value: "false"
        
      # Google OAuth (sử dụng production URLs)
      - key: GOOGLE_OAUTH_CLIENT_ID
        value: 338086073257-7bnq7vac6tvg8r7um3494488f2fvd10k.apps.googleusercontent.com
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        value: 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
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://fishshop-web.onrender.com/DuAnCaCanh/googlecallback
        
      # TinyMCE
      - key: TINYMCE_API_KEY
        value: ixvrmxjpwbm0zkly4uk21z8ra8bmddz497tnmek3ygae5srq
      - key: TINYMCE_VERSION
        value: "6"
        
      # Blog settings
      - key: BLOG_POSTS_PER_PAGE
        value: "6"
      - key: BLOG_FEATURED_POSTS_COUNT
        value: "3"
      - key: BLOG_EXCERPT_LENGTH
        value: "150"
        
      # File upload settings
      - key: UPLOAD_MAX_SIZE
        value: "10485760"
      - key: UPLOAD_ALLOWED_TYPES
        value: "jpg,jpeg,png,gif,pdf,doc,docx"
