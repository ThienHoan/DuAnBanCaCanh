services:
  # PostgreSQL Database - Free tier cho demo
  - type: pserv
    name: fishshop-db
    plan: free
    
  # Java Web Application - Demo version
  - type: web
    name: fishshop-demo
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Database connection
      - key: DATABASE_URL
        fromDatabase:
          name: fishshop-db
          property: connectionString
          
      # Demo settings
      - key: APP_ENV
        value: demo
      - key: APP_DEBUG
        value: "true"
        
      # OAuth cho demo (sẽ update URL sau)
      - key: GOOGLE_CLIENT_ID
        value: 338086073257-7bnq7vac6tvg8r7um3494488f2fvd10k.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET  
        value: 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
      - key: GOOGLE_REDIRECT_URI
        value: http://localhost:8080/googlecallback
